<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mezclador de aplicaciones</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mixer.css">
</head>
<body>
  <main id="app">
    <header class="mixer-head">
      <h1>Aplicaciones con audio</h1>
      <span id="count"></span>
    </header>
    <div id="list"></div>
    <p id="empty" class="empty" hidden>No hay aplicaciones con audio abiertas. Abre un video o música y aparecerá aquí.</p>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="mixer.js"></script>
</body>
</html>
